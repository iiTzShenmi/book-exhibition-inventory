{% extends 'login_base.html' %}

{% block content %}
  <div class="login-brand">
    <span class="login-brand__mark">📚</span>
    <span class="login-brand__text">
      <span class="eyebrow">Book Expo</span>
      <span class="login-title">管理登入</span>
    </span>
  </div>

  <div>
    <p id="login-help" class="login-sub">僅限已建立帳號的工作人員登入，以維護庫存與櫃位。</p>
  </div>

  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}

  <form class="login-form" method="post" data-submit-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-field">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" placeholder="輸入管理帳號" autocomplete="username" required aria-describedby="login-help">
    </div>
    <div class="form-field">
      <label for="password">密碼</label>
      <input type="password" id="password" name="password" placeholder="輸入密碼" autocomplete="current-password" required>
    </div>
    <button class="login-btn" type="submit" data-pending-label="驗證中...">登入後台</button>
  </form>

  <div class="form-links">
    <a href="{{ url_for('auth.register') }}" class="back-link">🆕 申請管理帳號</a>
    <a href="{{ url_for('inventory.home') }}" class="back-link">← 返回書展搜尋</a>
  </div>
{% endblock %}
