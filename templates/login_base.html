<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "管理登入" }}</title>
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      width: 320px;
      text-align: center;
    }
    h2 {
      margin-bottom: 1.5rem;
      color: #3498db;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      background: linear-gradient(135deg, #4db3f7, #2c85d8);
      color: #fff;
      border: none;
      padding: 12px 0;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 2px 4px rgba(77, 179, 247, 0.25);
    }
    button:hover {
      background: linear-gradient(135deg, #2c85d8, #1f6391);
      box-shadow: 0 4px 8px rgba(44, 133, 216, 0.35);
    }
    p.error {
      color: red;
      font-size: 0.9rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #3498db;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
