name: security-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXIS_SKIP_STARTUP_INIT: "1"
      DATABASE_URL: "sqlite:///:memory:"
      FLASK_SECRET_KEY: test-ci-secret
      APP_ENV: testing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: |
          python -m py_compile app.py routes/auth.py routes/admin.py routes/inventory.py routes/api.py database/models.py tools/create_admin_code.py database/tools/db_tools.py
      - name: Run regression tests
        run: pytest
      - name: Audit pinned dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off
      - name: Static security scan
        run: bandit -r . -x ./tests -ll
