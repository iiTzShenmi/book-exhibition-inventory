services:
  - type: cron
    name: exis-offsite-postgres-backup
    runtime: docker
    dockerfilePath: ./Dockerfile.offsite-backup
    dockerCommand: python -m database.tools.offsite_backup
    schedule: "0 2 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EXIS_BACKUP_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EXIS_BACKUP_S3_REGION
        sync: false
